apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirenonroot
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenonroot

        violation[{"msg": msg}] {
          c := input_containers[_]
          not runs_as_non_root(c)
          msg := sprintf("container %v must set runAsNonRoot: true", [c.name])
        }

        violation[{"msg": msg}] {
          input.review.object.spec.securityContext.runAsUser == 0
          msg := "pod must not set runAsUser: 0"
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          c.securityContext.runAsUser == 0
          msg := sprintf("container %v must not set runAsUser: 0", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not read_only_root(c)
          msg := sprintf("container %v must set readOnlyRootFilesystem: true", [c.name])
        }

        runs_as_non_root(c) {
          c.securityContext.runAsNonRoot == true
        }

        runs_as_non_root(c) {
          input.review.object.spec.securityContext.runAsNonRoot == true
        }

        read_only_root(c) {
          c.securityContext.readOnlyRootFilesystem == true
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }
